<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アシタノパン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --crust:     #C8892A;
  --crust-dk:  #9E6A18;
  --crust-lt:  #F0D9A8;
  --crumb:     #FAF3E3;
  --crumb2:    #FDF8EF;
  --sesame:    #7A5A10;
  --ink:       #2A1F0E;
  --ink2:      #5C4A28;
  --ink3:      #A08B6A;
  --line:      #E8D9BC;
  --ok:        #3A7D44;
  --ok-lt:     #D4ECD9;
  --warn:      #C47A1E;
  --warn-lt:   #FBEACC;
  --ng:        #B03020;
  --ng-lt:     #F5DDD9;
  --r:         14px;

  /* 接近バナーの高さ（JS で参照） */
  --nearby-h:  0px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--crumb); color: var(--ink);
  min-height: 100dvh; max-width: 430px; margin: 0 auto;
  overflow-x: hidden; position: relative;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 8%, rgba(200,137,42,.07) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 85% 85%, rgba(200,137,42,.05) 0%, transparent 60%);
}

/* ════════════════════
   ヘッダー
════════════════════ */
.header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(250,243,227,.96); backdrop-filter: blur(14px);
  border-bottom: 2px solid var(--crust-lt);
  padding: 11px 18px 9px;
}
.header-row { display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-ja {
  font-family: 'Noto Serif JP', serif;
  font-size: 20px; font-weight: 700; color: var(--sesame); letter-spacing: .5px;
}
.logo-tagline { font-size: 10px; color: var(--ink3); margin-top: 1px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--crumb2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; transition: background .15s, transform .1s;
}
.icon-btn:active { transform: scale(.93); background: var(--line); }

/* ════════════════════
   位置情報ステータスバー
════════════════════ */
.geo-bar {
  position: sticky; top: 59px; z-index: 199;
  padding: 5px 18px; font-size: 12px;
  display: flex; align-items: center; gap: 8px;
  background: rgba(250,243,227,.96); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.geo-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; transition: background .3s;
}
.geo-dot.inactive  { background: var(--line); }
.geo-dot.searching { background: var(--warn); animation: blink 1.2s infinite; }
.geo-dot.active    { background: var(--ok); }
.geo-dot.near      { background: var(--ng); animation: blink .7s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
.geo-label { flex: 1; color: var(--ink2); font-size: 11px; }
.geo-acc   { font-size: 11px; color: var(--ink3); }

/* ════════════════════
   接近バナー（常駐）
════════════════════ */
.nearby-banner {
  position: sticky; top: 88px; z-index: 198;
  overflow: hidden;
  max-height: 0;
  transition: max-height .4s cubic-bezier(.25,.8,.25,1);
}
.nearby-banner.visible { max-height: 100px; }

.nearby-banner-inner {
  background: linear-gradient(135deg, #8A2010 0%, var(--ng) 100%);
  padding: 11px 18px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 2px solid rgba(255,255,255,.15);
}
.nb-ping-wrap { position: relative; flex-shrink: 0; }
.nb-ping {
  width: 12px; height: 12px; border-radius: 50%; background: #fff;
  animation: blink .7s infinite;
}
/* 電波輪 */
.nb-ring {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.6);
  animation: ring 1.4s ease-out infinite;
}
.nb-ring:nth-child(2) { animation-delay: .5s; }
@keyframes ring {
  0%  { width: 12px; height: 12px; opacity: .7; }
  100%{ width: 36px; height: 36px; opacity: 0;  }
}
.nb-text { flex: 1; color: #fff; }
.nb-store { font-size: 15px; font-weight: 700; letter-spacing: .3px; line-height: 1.2; }
.nb-sub   { font-size: 11px; opacity: .8; margin-top: 2px; }
.nb-dist  {
  background: rgba(255,255,255,.2); color: #fff;
  font-size: 12px; font-weight: 600;
  padding: 4px 11px; border-radius: 20px; flex-shrink: 0;
}
.nb-list-btn {
  background: #fff; color: var(--ng);
  border: none; border-radius: 20px;
  padding: 6px 14px; font-size: 12px; font-weight: 700;
  cursor: pointer; flex-shrink: 0;
  font-family: 'Noto Sans JP', sans-serif;
  transition: opacity .15s;
}
.nb-list-btn:active { opacity: .8; }

/* ════════════════════
   タブ
════════════════════ */
.tabs {
  position: sticky; top: 88px; z-index: 197;
  display: flex;
  background: rgba(250,243,227,.96); backdrop-filter: blur(14px);
  border-bottom: 1.5px solid var(--line);
  transition: top .4s;
}
.tabs.with-banner { top: 151px; }   /* バナー分下がる */
.tab {
  flex: 1; padding: 9px 2px; text-align: center;
  font-size: 12px; font-weight: 500; color: var(--ink3);
  border-bottom: 2.5px solid transparent; cursor: pointer;
  transition: color .2s, border-color .2s; user-select: none;
}
.tab.active { color: var(--crust-dk); border-bottom-color: var(--crust); }
/* 買い物タブに件数バッジ */
.tab-badge {
  display: inline-block; background: var(--ng); color: #fff;
  font-size: 10px; font-weight: 700;
  min-width: 17px; height: 17px; border-radius: 9px;
  line-height: 17px; padding: 0 4px;
  margin-left: 3px; vertical-align: middle;
}

/* ════════════════════
   コンテンツ
════════════════════ */
.main { padding: 16px 18px 100px; position: relative; z-index: 1; }
.view { display: none; }
.view.active { display: block; }
.sec-label {
  font-size: 10px; font-weight: 600; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--ink3);
  margin-bottom: 10px; padding-left: 2px;
  display: flex; align-items: center; gap: 6px;
}
.sec-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* ════════════════════
   在庫カード
════════════════════ */
.stock-card {
  background: var(--crumb2);
  border-radius: 20px 20px 13px 13px;
  border: 1.5px solid var(--line); border-top: 3px solid var(--crust-lt);
  padding: 14px 15px 13px;
  margin-bottom: 11px; position: relative; overflow: hidden;
  animation: riseUp .35s ease both;
}
.stock-card:nth-child(1){animation-delay:.04s}
.stock-card:nth-child(2){animation-delay:.09s}
.stock-card:nth-child(3){animation-delay:.14s}
.stock-card:active { transform: scale(.99); }
.card-gauge {
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  border-radius: 4px 0 0 4px; transition: background .4s;
}
.card-inner { padding-left: 7px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; }
.card-emoji { font-size: 26px; line-height: 1; }
.status-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
.card-name {
  font-family: 'Noto Serif JP', serif;
  font-size: 18px; font-weight: 600; margin-top: 7px;
}
.qty-row { display: flex; align-items: baseline; gap: 4px; margin-top: 2px; }
.qty-num { font-size: 30px; font-weight: 600; line-height: 1; }
.qty-unit { font-size: 13px; color: var(--ink3); }
.prog-track {
  height: 7px; background: var(--crust-lt); border-radius: 4px; margin-top: 11px; overflow: hidden;
}
.prog-fill { height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.34,1.2,.64,1), background .4s; }
.card-acts { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.qty-ctrl {
  display: flex; align-items: center;
  background: var(--crumb); border-radius: 24px; border: 1.5px solid var(--line);
  overflow: hidden; flex: 1;
}
.qbtn {
  width: 36px; height: 36px; border: none; background: none;
  font-size: 20px; cursor: pointer; color: var(--ink2);
  display: flex; align-items: center; justify-content: center;
  transition: background .12s;
}
.qbtn:active { background: var(--line); }
.q-label { flex: 1; text-align: center; font-size: 12px; font-weight: 500; color: var(--ink3); }
.act-btn {
  height: 36px; padding: 0 13px; border-radius: 24px;
  border: 1.5px solid var(--line); background: var(--crumb2);
  font-size: 12px; font-weight: 500; cursor: pointer; color: var(--ink2);
  white-space: nowrap; font-family: 'Noto Sans JP', sans-serif; transition: background .12s;
}
.act-btn:active { background: var(--line); }
.act-btn.list-add { border-color: var(--crust-lt); background: var(--crust-lt); color: var(--sesame); font-weight: 600; }
.act-btn.listed   { color: var(--ink3); font-size: 11px; }

.s-ok   { color: var(--ok);   background: var(--ok-lt); }
.s-low  { color: var(--warn); background: var(--warn-lt); }
.s-empty{ color: var(--ng);   background: var(--ng-lt); }
.g-ok   { background: var(--ok); }
.g-low  { background: var(--warn); }
.g-empty{ background: var(--ng); }
.f-ok   { background: linear-gradient(90deg,var(--ok),#5AA866); }
.f-low  { background: linear-gradient(90deg,var(--warn),#D4921E); }
.f-empty{ background: var(--ng); }

/* ════════════════════
   買い物リスト（大きく・見やすく）
════════════════════ */
.shop-empty {
  text-align: center; padding: 44px 20px; color: var(--ink3);
}
.shop-empty-icon { font-size: 50px; margin-bottom: 12px; }
.shop-empty-txt  { font-size: 14px; line-height: 1.9; }

/* 購入予定カウントバー */
.list-header {
  background: linear-gradient(135deg, var(--crust-dk), var(--crust));
  color: #fff; border-radius: 20px 20px 13px 13px;
  border-top: 3px solid rgba(255,255,255,.2);
  padding: 13px 16px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 4px 16px rgba(200,137,42,.22);
}
.lh-count { font-size: 30px; font-weight: 700; line-height: 1; }
.lh-text  { flex: 1; font-size: 13px; line-height: 1.6; }
.lh-all-done {
  background: var(--ok); border-radius: 20px 20px 13px 13px;
  color: #fff; padding: 13px 16px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600;
  box-shadow: 0 4px 14px rgba(58,125,68,.25);
}

/* 買い物アイテム（大きく・タップしやすく） */
.shop-item {
  background: var(--crumb2);
  border-radius: 20px 20px 13px 13px;
  border: 1.5px solid var(--line); border-top: 3px solid var(--crust-lt);
  margin-bottom: 10px;
  position: relative; overflow: hidden;
  transition: opacity .25s, transform .1s;
  animation: riseUp .3s ease both;
  cursor: pointer;
}
.shop-item:active { transform: scale(.99); }
.shop-item.checked { opacity: .42; }

/* ステータス強調ライン（左） */
.shop-item.st-low   { border-left: 5px solid var(--warn); }
.shop-item.st-empty { border-left: 5px solid var(--ng); box-shadow: 0 0 0 2px rgba(176,48,32,.08); }

.shop-item-body {
  display: flex; align-items: center;
  gap: 14px; padding: 16px 16px 14px;
}

/* チェックボタン（大きく） */
.check-circle {
  width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
  border: 2.5px solid var(--line); background: var(--crumb);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; transition: background .15s, border-color .2s, transform .1s;
}
.check-circle:active { transform: scale(.92); }
.shop-item.checked .check-circle {
  background: var(--ok); border-color: var(--ok); color: #fff;
}

.shop-item-info { flex: 1; min-width: 0; }
.shop-emoji  { font-size: 28px; line-height: 1; margin-bottom: 5px; }
.shop-name   { font-family: 'Noto Serif JP', serif; font-size: 22px; font-weight: 700; }

/* 在庫状況の行（残量 → 購入後） */
.shop-stock-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px; flex-wrap: wrap;
}
.shop-stock-badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
.shop-arrow { font-size: 14px; color: var(--ink3); }
.shop-after {
  font-size: 13px; font-weight: 600; color: var(--ok);
  background: var(--ok-lt); padding: 3px 10px; border-radius: 20px;
}

/* 現在在庫テキスト */
.shop-current { font-size: 11px; color: var(--ink3); margin-top: 4px; }

/* ミニプログレスバー */
.shop-prog {
  height: 5px; background: var(--crust-lt); border-radius: 3px; margin-top: 8px;
  overflow: hidden;
}
.shop-prog-fill { height: 100%; border-radius: 3px; transition: width .4s; }

/* チェック時フラッシュ */
.reflect-flash {
  position: absolute; inset: 0; pointer-events: none;
  background: var(--ok-lt); opacity: 0; border-radius: inherit; transition: opacity .08s;
}
.reflect-flash.on { opacity: 1; }

/* 購入済みセパレーター */
.done-sep {
  font-size: 10px; color: var(--ink3); margin: 16px 0 8px;
  font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
}

/* ════════════════════
   店舗タブ
════════════════════ */
.loc-panel {
  background: var(--crumb2); border-radius: var(--r);
  border: 1.5px solid var(--line); padding: 14px 16px; margin-bottom: 14px;
}
.store-card {
  background: var(--crumb2); border-radius: 18px 18px 12px 12px;
  border: 1.5px solid var(--line); border-top: 2.5px solid var(--crust-lt);
  padding: 14px 15px; margin-bottom: 10px; animation: riseUp .3s ease both;
}
.store-card.nearby {
  border-color: var(--ng); border-top-color: var(--ng);
  box-shadow: 0 0 0 3px rgba(176,48,32,.1);
}
.store-card-head { display: flex; align-items: center; gap: 10px; }
.store-name { font-size: 15px; font-weight: 600; flex: 1; }
.store-dist { font-size: 12px; color: var(--ink3); }
.store-meta { font-size: 11px; color: var(--ink3); margin-top: 5px; padding-left: 34px; }
.store-acts { display: flex; gap: 7px; margin-top: 10px; }
.store-btn {
  flex: 1; height: 34px; border-radius: 20px;
  border: 1.5px solid var(--line); background: var(--crumb);
  font-size: 12px; font-weight: 500; cursor: pointer; color: var(--ink2);
  font-family: 'Noto Sans JP', sans-serif; transition: background .12s;
}
.store-btn:active { background: var(--line); }
.store-btn.primary { background: var(--crust); border-color: var(--crust); color: #fff; }
.store-btn.danger  { color: var(--ng); border-color: var(--ng-lt); }
.nearby-badge {
  font-size: 10px; font-weight: 600; color: var(--ng);
  background: var(--ng-lt); padding: 2px 7px; border-radius: 10px;
  animation: blink .8s infinite;
}
.add-store-form {
  background: var(--crumb2); border-radius: var(--r);
  border: 1.5px dashed var(--line); padding: 14px 16px; margin-bottom: 12px;
}
.add-store-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: var(--ink2); }
.form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 9px; }
.form-label { font-size: 11px; color: var(--ink3); font-weight: 500; }
.form-input {
  height: 38px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--crumb); padding: 0 12px; font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif; color: var(--ink); transition: border-color .15s;
}
.form-input:focus { outline: none; border-color: var(--crust); }
.form-row-2 { display: flex; gap: 8px; }
.form-row-2 .form-row { flex: 1; }
.use-current {
  width: 100%; height: 36px; border-radius: 20px;
  border: 1.5px solid var(--crust); background: var(--crust-lt); color: var(--sesame);
  font-size: 12px; font-weight: 600; cursor: pointer; margin-bottom: 9px;
  font-family: 'Noto Sans JP', sans-serif;
}
.add-btn {
  width: 100%; height: 40px; border-radius: 24px; border: none;
  background: var(--crust); color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: background .15s;
}
.add-btn:active { background: var(--crust-dk); }

/* ════════════════════
   設定
════════════════════ */
.thresh-panel {
  background: var(--crumb2); border-radius: var(--r);
  border: 1.5px solid var(--line); padding: 14px 16px; margin-bottom: 12px;
}
.thresh-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--ink);
}
.thresh-row {
  display: flex; align-items: center; padding: 8px 0;
  border-bottom: 1px solid var(--line); gap: 10px;
}
.thresh-row:last-child { border-bottom: none; }
.t-emoji { font-size: 18px; }
.t-name  { flex: 1; font-size: 13px; font-weight: 500; }
.t-ctrl  {
  display: flex; align-items: center;
  background: var(--crumb); border-radius: 18px; border: 1px solid var(--line); overflow: hidden;
}
.t-btn {
  width: 30px; height: 30px; border: none; background: none;
  font-size: 18px; cursor: pointer; color: var(--ink2);
  display: flex; align-items: center; justify-content: center; transition: background .12s;
}
.t-btn:active { background: var(--line); }
.t-val  { width: 42px; text-align: center; font-size: 13px; font-weight: 600; }
.t-unit { font-size: 11px; color: var(--ink3); min-width: 22px; }

/* ════════════════════
   UNDOバナー
════════════════════ */
.undo-banner {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--ink); color: #fff; border-radius: 28px;
  padding: 10px 18px; display: flex; align-items: center; gap: 12px;
  font-size: 13px; font-weight: 500; white-space: nowrap;
  z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,.22);
  transition: transform .3s cubic-bezier(.34,1.3,.64,1);
}
.undo-banner.visible { transform: translateX(-50%) translateY(0); }
.undo-btn {
  background: rgba(255,255,255,.2); border: none; color: #fff;
  padding: 4px 11px; border-radius: 18px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: background .12s;
}
.undo-btn:active { background: rgba(255,255,255,.35); }

@keyframes riseUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <div class="header-row">
    <div class="logo">
      <svg width="40" height="24" viewBox="0 0 42 26" fill="none">
        <ellipse cx="21" cy="16" rx="20" ry="9" fill="#E8C060"/>
        <ellipse cx="21" cy="13" rx="19" ry="8" fill="url(#cg)"/>
        <path d="M6 13 Q21 9 36 13" stroke="#C49030" stroke-width="1.2" stroke-linecap="round" fill="none" opacity=".7"/>
        <ellipse cx="14" cy="11" rx="1.2" ry=".7" fill="#8B6914" opacity=".6" transform="rotate(-15 14 11)"/>
        <ellipse cx="21" cy="9.5" rx="1.2" ry=".7" fill="#8B6914" opacity=".6"/>
        <ellipse cx="28" cy="11" rx="1.2" ry=".7" fill="#8B6914" opacity=".6" transform="rotate(-10 28 11)"/>
        <ellipse cx="3"  cy="16" rx="3" ry="7" fill="#C49030"/>
        <ellipse cx="39" cy="16" rx="3" ry="7" fill="#C49030"/>
        <ellipse cx="21" cy="23" rx="18" ry="3.5" fill="#C49030" opacity=".35"/>
        <defs>
          <radialGradient id="cg" cx="40%" cy="30%" r="70%">
            <stop offset="0%"   stop-color="#F5D98A"/>
            <stop offset="50%"  stop-color="#E8C060"/>
            <stop offset="100%" stop-color="#C49030"/>
          </radialGradient>
        </defs>
      </svg>
      <div>
        <div class="logo-ja">アシタノパン</div>
        <div class="logo-tagline">明日の食卓を、今日整える</div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <div class="icon-btn" onclick="toggleGeo()">📍</div>
    </div>
  </div>
</div>

<!-- 位置情報ステータスバー -->
<div class="geo-bar">
  <div class="geo-dot inactive" id="geo-dot"></div>
  <div class="geo-label" id="geo-label">位置情報：オフ</div>
  <div class="geo-acc"   id="geo-acc"></div>
</div>

        食材3種類固定（たまご・牛乳・もやし）<br>
        位置情報はブラウザの Geolocation API を使用<br>
        データはメモリ内保持（リロードでリセット）

</div>

<!-- UNDO バナー -->
<div class="undo-banner" id="undo-banner">
  <span id="undo-msg"></span>
  <button class="undo-btn" onclick="doUndo()">元に戻す</button>
</div>

<script>
// ══════════════════════════════════
//  データ
// ══════════════════════════════════
const ITEMS = [
  { id:'egg',  name:'たまご', emoji:'🥚', unit:'個' },
  { id:'milk', name:'牛乳',   emoji:'🥛', unit:'ml' },
  { id:'moya', name:'もやし', emoji:'🌱', unit:'g'  },
];
const state = {
  stock:      { egg:6,  milk:400,  moya:200 },
  thresholds: { egg:4,  milk:300,  moya:100 },
  defaultQty: { egg:10, milk:1000, moya:200 },
  shoppingList:[], nextId:1,
  stores:[
    { id:'s1', name:'スーパーABC 松江店', lat:35.4682, lng:133.0485, radius:300, lastNotified:null },
    { id:'s2', name:'マルナカ 東出雲店',  lat:35.4320, lng:133.1020, radius:200, lastNotified:null },
  ],
  geo:{ watching:false, watchId:null, lat:null, lng:null, acc:null },
  nearbyStore: null,
};
let undoStack=null, undoTimer=null, geoInterval=null;

// ── ユーティリティ ──
function getStatus(id){ const q=state.stock[id],t=state.thresholds[id]; return q===0?'empty':q<=t?'low':'ok'; }
const SL={ ok:'✓ 在庫あり', low:'⚠ 残り少', empty:'✕ 切れ' };
function isInList(id){ return state.shoppingList.some(i=>i.itemId===id&&!i.checkedAt); }
function addToList(id,auto=false){ if(isInList(id)) return; state.shoppingList.push({id:state.nextId++,itemId:id,addedAuto:auto,checkedAt:null}); }
function checkAutoAdd(id){ if(getStatus(id)!=='ok'&&!isInList(id)) addToList(id,true); }
function changeStock(id,delta,label){ const prev=state.stock[id]; state.stock[id]=Math.max(0,prev+delta); scheduleUndo({type:'stock',id,prev,label}); checkAutoAdd(id); }
function haversine(la1,lo1,la2,lo2){ const R=6371000,dL=(la2-la1)*Math.PI/180,dG=(lo2-lo1)*Math.PI/180; const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dG/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function isInTimeWindow(){ const now=new Date(); const[sh,sm]=(document.getElementById('notif-start')?.value||'07:00').split(':').map(Number); const[eh,em]=(document.getElementById('notif-end')?.value||'22:00').split(':').map(Number); const cur=now.getHours()*60+now.getMinutes(); return cur>=sh*60+sm&&cur<=eh*60+em; }

// ── UNDO ──
function scheduleUndo(e){ undoStack=e; clearTimeout(undoTimer); document.getElementById('undo-msg').textContent=e.label; document.getElementById('undo-banner').classList.add('visible'); undoTimer=setTimeout(clearUndo,4000); }
function doUndo(){
  if(!undoStack) return;
  const e=undoStack;
  if(e.type==='stock') state.stock[e.id]=e.prev;
  if(e.type==='check'){ const si=state.shoppingList.find(i=>i.id===e.listId); if(si){si.checkedAt=null;state.stock[e.itemId]=Math.max(0,state.stock[e.itemId]-e.qty);} }
  if(e.type==='list-add') state.shoppingList=state.shoppingList.filter(i=>i.id!==e.listId);
  clearUndo(); renderAll();
}
function clearUndo(){ undoStack=null; clearTimeout(undoTimer); document.getElementById('undo-banner').classList.remove('visible'); }

// ── 位置情報 ──
function toggleGeo(){ state.geo.watching?stopGeo():startGeo(); }
function startGeo(){
  if(!navigator.geolocation){ alert('このブラウザは位置情報をサポートしていません。'); return; }
  setGeoUI('searching','位置情報を取得中…');
  navigator.geolocation.getCurrentPosition(onGeoOk,onGeoErr,{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  state.geo.watchId=navigator.geolocation.watchPosition(onGeoOk,onGeoErr,{enableHighAccuracy:true,timeout:10000,maximumAge:5000});
  state.geo.watching=true;
  geoInterval=setInterval(checkGeofences,5000);
}
function stopGeo(){
  if(state.geo.watchId!==null) navigator.geolocation.clearWatch(state.geo.watchId);
  clearInterval(geoInterval);
  Object.assign(state.geo,{watching:false,watchId:null,lat:null,lng:null,acc:null});
  setGeoUI('inactive','位置情報：オフ','');
  hideNearbyBanner(); renderAll();
}
function onGeoOk(pos){
  state.geo.lat=pos.coords.latitude; state.geo.lng=pos.coords.longitude; state.geo.acc=Math.round(pos.coords.accuracy);
  setGeoUI('active',`取得中 (${state.geo.lat.toFixed(4)}, ${state.geo.lng.toFixed(4)})`,`±${state.geo.acc}m`);
  checkGeofences(); renderAll();
}
function onGeoErr(e){
  const m={1:'位置情報へのアクセスが拒否されました',2:'位置情報を取得できませんでした',3:'取得がタイムアウトしました'};
  setGeoUI('inactive',m[e.code]||'位置情報エラー',''); state.geo.watching=false;
}
function setGeoUI(s,l,a=''){ document.getElementById('geo-dot').className=`geo-dot ${s}`; document.getElementById('geo-label').textContent=l; document.getElementById('geo-acc').textContent=a; }

// ── ジオフェンスチェック ──
function checkGeofences(){
  if(!state.geo.lat||!state.geo.lng) return;
  const hasItems=state.shoppingList.some(i=>!i.checkedAt);

  // 現在接近中の店舗との距離を再計算してバナー更新
  if(state.nearbyStore){
    const d=Math.round(haversine(state.geo.lat,state.geo.lng,state.nearbyStore.lat,state.nearbyStore.lng));
    document.getElementById('nb-dist').textContent=`約${d}m`;
    // 圏外に出たらバナーを消す
    if(d > state.nearbyStore.radius * 1.3){
      hideNearbyBanner();
    }
  }

  if(!hasItems||!isInTimeWindow()) return;

  for(const s of state.stores){
    const d=haversine(state.geo.lat,state.geo.lng,s.lat,s.lng);
    s._dist=Math.round(d);
    if(d<=s.radius){
      if(s.lastNotified===todayStr()) continue;
      s.lastNotified=todayStr();
      showNearbyBanner(s, Math.round(d));
      break;
    }
  }
  renderLocation();
}

// ── 接近バナーの表示・非表示 ──
function showNearbyBanner(store, dist){
  state.nearbyStore=store;
  document.getElementById('nb-store').textContent=store.name;
  document.getElementById('nb-sub').textContent=`付近にいます・買い物リスト ${state.shoppingList.filter(i=>!i.checkedAt).length}品`;
  document.getElementById('nb-dist').textContent=`約${dist}m`;
  document.getElementById('nearby-banner').classList.add('visible');
  document.getElementById('tabs').classList.add('with-banner');
  setGeoUI('near',`${store.name} 付近`,`約${dist}m`);
  // タブバッジ更新
  updateListBadge();
}
function hideNearbyBanner(){
  state.nearbyStore=null;
  document.getElementById('nearby-banner').classList.remove('visible');
  document.getElementById('tabs').classList.remove('with-banner');
  if(state.geo.lat){
    setGeoUI('active',`取得中 (${state.geo.lat.toFixed(4)}, ${state.geo.lng.toFixed(4)})`,`±${state.geo.acc}m`);
  }
}
function updateListBadge(){
  const n=state.shoppingList.filter(i=>!i.checkedAt).length;
  const badge=document.getElementById('list-badge');
  if(n>0&&state.nearbyStore){ badge.textContent=n; badge.style.display=''; }
  else { badge.style.display='none'; }
}
function goToList(){ switchTab('shopping'); }

// ── 接近シミュレーション ──
function simulateApproach(sid){
  const s=state.stores.find(x=>x.id===sid); if(!s) return;
  if(!state.shoppingList.some(i=>!i.checkedAt)){ alert('買い物リストが空のため動作しません。\n在庫を減らしてからお試しください。'); return; }
  s.lastNotified=null;
  showNearbyBanner(s, Math.round(s.radius*0.5));
  renderAll();
}
function useCurrentLocation(){ if(!state.geo.lat){alert('まず📍で位置情報を開始してください。');return;} document.getElementById('inp-lat').value=state.geo.lat.toFixed(6); document.getElementById('inp-lng').value=state.geo.lng.toFixed(6); }
function addStore(){ const name=document.getElementById('inp-name').value.trim(); const lat=parseFloat(document.getElementById('inp-lat').value); const lng=parseFloat(document.getElementById('inp-lng').value); const radius=parseInt(document.getElementById('inp-radius').value)||200; if(!name){alert('店舗名を入力してください');return;} if(isNaN(lat)||isNaN(lng)){alert('緯度・経度を入力してください');return;} state.stores.push({id:'s'+Date.now(),name,lat,lng,radius,lastNotified:null}); document.getElementById('inp-name').value=''; document.getElementById('inp-lat').value=''; document.getElementById('inp-lng').value=''; renderAll(); }
function deleteStore(id){ state.stores=state.stores.filter(s=>s.id!==id); renderAll(); }
function resetStoreNotif(id){ const s=state.stores.find(s=>s.id===id); if(s){s.lastNotified=null;renderAll();} }

// ── 在庫レンダリング ──
function renderStock(){
  const c=document.getElementById('stock-cards'); c.innerHTML='';
  ITEMS.forEach(item=>{
    const qty=state.stock[item.id],max=state.defaultQty[item.id]*1.5;
    const pct=Math.min(100,Math.round(qty/max*100));
    const st=getStatus(item.id),inL=isInList(item.id);
    const step=item.unit==='個'?1:item.unit==='ml'?100:50;
    const d=document.createElement('div'); d.className='stock-card';
    d.innerHTML=`
      <div class="card-gauge g-${st}"></div>
      <div class="card-inner">
        <div class="card-head">
          <div class="card-emoji">${item.emoji}</div>
          <div class="status-badge s-${st}">${SL[st]}</div>
        </div>
        <div class="card-name">${item.name}</div>
        <div class="qty-row"><div class="qty-num">${qty}</div><div class="qty-unit">${item.unit}</div></div>
        <div class="prog-track"><div class="prog-fill f-${st}" style="width:${pct}%"></div></div>
        <div class="card-acts">
          <div class="qty-ctrl">
            <button class="qbtn" onclick="consume('${item.id}')">−</button>
            <div class="q-label">${step}${item.unit}</div>
            <button class="qbtn" onclick="addStock('${item.id}')">＋</button>
          </div>
          ${inL?`<button class="act-btn listed">リスト追加済み</button>`:`<button class="act-btn list-add" onclick="manualAdd('${item.id}')">リストへ</button>`}
        </div>
      </div>`;
    c.appendChild(d);
  });
}
function consume(id){ const item=ITEMS.find(i=>i.id===id),step=item.unit==='個'?1:item.unit==='ml'?100:50; changeStock(id,-step,`${item.name} ${step}${item.unit}を消費 → 元に戻す`); renderAll(); }
function addStock(id){ const item=ITEMS.find(i=>i.id===id),step=item.unit==='個'?1:item.unit==='ml'?100:50; changeStock(id,step,`${item.name} +${step}${item.unit} → 元に戻す`); renderAll(); }
function manualAdd(id){ const item=ITEMS.find(i=>i.id===id),lid=state.nextId; addToList(id,false); scheduleUndo({type:'list-add',listId:lid,label:`${item.name}をリストに追加 → 元に戻す`}); renderAll(); }

// ── 買い物リストレンダリング ──
function renderShopping(){
  const lEl=document.getElementById('shopping-list');
  const hEl=document.getElementById('list-header-area');
  lEl.innerHTML=''; hEl.innerHTML='';

  const active=state.shoppingList.filter(i=>!i.checkedAt);
  const done  =state.shoppingList.filter(i=> i.checkedAt);

  // バッジ更新
  updateListBadge();

  if(!state.shoppingList.length){
    lEl.innerHTML=`<div class="shop-empty"><div class="shop-empty-icon">🛍️</div><div class="shop-empty-txt">買い物リストは空です。<br>在庫が少なくなると自動で追加されます。</div></div>`;
    return;
  }

  // ヘッダーエリア
  if(active.length){
    hEl.innerHTML=`<div class="list-header">
      <div class="lh-count">${active.length}</div>
      <div class="lh-text">${active.length}品を購入予定<br><span style="opacity:.75;font-size:11px">チェックで在庫に即時反映</span></div>
      <div style="font-size:24px">🧺</div></div>`;
  } else if(done.length){
    hEl.innerHTML=`<div class="lh-all-done"><span style="font-size:22px">✅</span> 全品購入済みです！</div>`;
  }

  // 未購入アイテム（大きく・見やすく）
  active.forEach(si=>{
    const item=ITEMS.find(i=>i.id===si.itemId);
    const st=getStatus(si.itemId);
    const qty=state.stock[si.itemId];
    const dq=state.defaultQty[si.itemId];
    const maxQ=dq*1.5;
    const pct=Math.min(100,Math.round(qty/maxQ*100));
    const el=document.createElement('div');
    el.className=`shop-item st-${st}`;
    el.innerHTML=`
      <div class="reflect-flash" id="fl-${si.id}"></div>
      <div class="shop-item-body">
        <div class="check-circle" id="cc-${si.id}"></div>
        <div class="shop-item-info">
          <div class="shop-emoji">${item.emoji}</div>
          <div class="shop-name">${item.name}</div>
          <div class="shop-stock-row">
            <span class="shop-stock-badge s-${st}">${SL[st]}</span>
            <span class="shop-arrow">→</span>
            <span class="shop-after">+${dq}${item.unit}</span>
          </div>
          <div class="shop-current">現在 ${qty}${item.unit}　チェックで ${qty+dq}${item.unit} に</div>
          <div class="shop-prog"><div class="shop-prog-fill f-${st}" style="width:${pct}%"></div></div>
        </div>
      </div>`;
    el.addEventListener('click', ()=>toggleCheck(si.id));
    lEl.appendChild(el);
  });

  // 購入済み
  if(done.length){
    const sep=document.createElement('div'); sep.className='done-sep'; sep.textContent='購入済み'; lEl.appendChild(sep);
    done.forEach(si=>{
      const item=ITEMS.find(i=>i.id===si.itemId); const dq=state.defaultQty[si.itemId];
      const el=document.createElement('div');
      el.className='shop-item checked';
      el.innerHTML=`
        <div class="shop-item-body">
          <div class="check-circle" style="background:var(--ok);border-color:var(--ok);color:#fff;font-size:22px">✓</div>
          <div class="shop-item-info">
            <div class="shop-emoji">${item.emoji}</div>
            <div class="shop-name">${item.name}</div>
            <div style="font-size:12px;color:var(--ink3);margin-top:4px">+${dq}${item.unit} 在庫に反映済み</div>
          </div>
        </div>`;
      el.addEventListener('click',()=>toggleCheck(si.id));
      lEl.appendChild(el);
    });
  }
}

function toggleCheck(lid){
  const si=state.shoppingList.find(i=>i.id===lid); if(!si) return;
  const item=ITEMS.find(i=>i.id===si.itemId); const dq=state.defaultQty[si.itemId];
  if(!si.checkedAt){
    si.checkedAt=Date.now(); state.stock[si.itemId]+=dq;
    scheduleUndo({type:'check',listId:lid,itemId:si.itemId,qty:dq,label:`${item.name} +${dq}${item.unit}を在庫に反映 → 元に戻す`});
    const fl=document.getElementById(`fl-${lid}`);
    if(fl){fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),180);}
  } else {
    si.checkedAt=null; state.stock[si.itemId]=Math.max(0,state.stock[si.itemId]-dq);
  }
  renderAll();
}

// ── 店舗タブ ──
function renderLocation(){
  const lp=document.getElementById('loc-panel');
  lp.innerHTML=state.geo.lat
    ?`<div class="loc-panel"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span>🟢</span><span style="font-size:13px;font-weight:600">位置情報 取得中</span></div><div style="font-size:12px;color:var(--ink3);font-family:monospace;line-height:1.8">緯度 ${state.geo.lat.toFixed(6)}<br>経度 ${state.geo.lng.toFixed(6)}</div><div style="font-size:11px;color:var(--ink3);margin-top:4px">精度 ±${state.geo.acc}m</div></div>`
    :`<div class="loc-panel"><div style="font-size:13px;color:var(--ink3)">📍 ボタンで位置情報を開始してください。</div></div>`;
  const sl=document.getElementById('store-list'); sl.innerHTML='';
  if(!state.stores.length){ sl.innerHTML=`<div style="color:var(--ink3);font-size:13px;padding:12px 0">登録店舗はありません。</div>`; }
  state.stores.forEach(s=>{
    const dist=state.geo.lat?Math.round(haversine(state.geo.lat,state.geo.lng,s.lat,s.lng)):null;
    const nearby=dist!==null&&dist<=s.radius; const noted=s.lastNotified===todayStr();
    const d=document.createElement('div'); d.className=`store-card${nearby?' nearby':''}`;
    d.innerHTML=`
      <div class="store-card-head">
        <span style="font-size:22px">🏪</span>
        <div class="store-name">${s.name}</div>
        ${nearby?`<span class="nearby-badge">付近</span>`:''}
        <div class="store-dist">${dist!==null?(dist<1000?dist+'m':(dist/1000).toFixed(1)+'km'):'—'}</div>
      </div>
      <div class="store-meta">半径 ${s.radius}m　${noted?'<span style="color:var(--warn)">本日通知済み</span>':'通知待機中'}</div>
      <div class="store-acts">
        ${noted?`<button class="store-btn" onclick="resetStoreNotif('${s.id}')">通知をリセット</button>`:`<button class="store-btn primary" onclick="simulateApproach('${s.id}')">📡 接近をシミュレーション</button>`}
        <button class="store-btn danger" onclick="deleteStore('${s.id}')">削除</button>
      </div>`;
    sl.appendChild(d);
  });
}

// ── 設定 ──
function renderSettings(){
  ['thresh-rows','defqty-rows'].forEach((elId,idx)=>{
    const el=document.getElementById(elId); el.innerHTML='';
    ITEMS.forEach(item=>{
      const step=item.unit==='個'?1:item.unit==='ml'?100:50;
      const val=idx===0?state.thresholds[item.id]:state.defaultQty[item.id];
      const dec=idx===0?`adjT('${item.id}',-1)`:`adjD('${item.id}',-1)`;
      const inc=idx===0?`adjT('${item.id}',1)` :`adjD('${item.id}',1)`;
      const row=document.createElement('div'); row.className='thresh-row';
      row.innerHTML=`<div class="t-emoji">${item.emoji}</div><div class="t-name">${item.name}</div><div class="t-ctrl"><button class="t-btn" onclick="${dec}">−</button><div class="t-val">${val}</div><button class="t-btn" onclick="${inc}">＋</button></div><div class="t-unit">${item.unit}</div>`;
      el.appendChild(row);
    });
  });
}
function adjT(id,dir){ const s=ITEMS.find(i=>i.id===id),step=s.unit==='個'?1:s.unit==='ml'?100:50; state.thresholds[id]=Math.max(0,state.thresholds[id]+dir*step); renderSettings(); renderStock(); }
function adjD(id,dir){ const s=ITEMS.find(i=>i.id===id),step=s.unit==='個'?1:s.unit==='ml'?100:50; state.defaultQty[id]=Math.max(step,state.defaultQty[id]+dir*step); renderSettings(); }

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${name}`));
}
function renderAll(){ renderStock(); renderShopping(); renderLocation(); renderSettings(); }

// 初期化
state.stock.milk=200;
ITEMS.forEach(i=>checkAutoAdd(i.id));
renderAll();
</script>
